name: Do nguon du lieu

# Chi chay khi bam tay. Khong co lich.
# Muc dich: biet nguon nao goi duoc TU RUNNER CUA GITHUB. Moi truong phat trien
# chan gan het host ngoai package registry nen thu o cho khac khong noi len gi.
# Script chi DOC, khong ghi vao data.js, nen chay bao nhieu lan cung an toan.
on:
  workflow_dispatch:
    inputs:
      nhom:
        description: 'Nhom can do, cach nhau bang dau cach (brent wti gold dxy). De trong = tat ca.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cai xlrd (doc .xls cua EIA)
        run: pip install --quiet xlrd

      - name: Cai trinh duyet headless (chi khi nhom=sbv)
        if: inputs.nhom == 'sbv'
        run: pip install --quiet playwright && playwright install --with-deps chromium

      - name: Do trang SBV bang trinh duyet
        if: inputs.nhom == 'sbv'
        run: python3 tools/probe_sbv.py

      - name: Do kha nang ket noi (lien ngan hang, lai suat huy dong)
        if: inputs.nhom == '' || contains('reach trich dao servlet', inputs.nhom)
        run: python3 tools/probe_reach.py --${{ inputs.nhom }}

      - name: Do cac nguon ung vien
        if: inputs.nhom != 'sbv' && (inputs.nhom == '' || !contains('reach trich dao servlet', inputs.nhom))
        run: python3 tools/probe_sources.py ${{ github.event.inputs.nhom }}
