name: Cap nhat field CORE

on:
  schedule:
    # 01:17 UTC = 08:17 ICT hang ngay. Dung phut le de tranh gio cao diem cua runner.
    - cron: '17 1 * * *'
  workflow_dispatch:        # cho phep bam chay tay tu tab Actions

permissions:
  contents: write

concurrency:
  group: update-core
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai xlrd (doc .xls giao ngay cua EIA)
        run: pip install --quiet xlrd

      - name: Lay du lieu CORE
        id: fetch
        run: python3 tools/fetch_core.py | tee /tmp/fetch.log

      - name: Dong bo TIER_MAP voi models.json
        # Chan code: index.html phai dang dong bo voi tools/models.json.
        # Khong lien quan do tuoi du lieu nen buoc nay an toan de chan.
        run: python3 tools/gen_registry.py --check

      - name: Kiem tra truoc khi commit (lop 1-4)
        # CHI cu phap, runtime, NaN, kieu du lieu — nhung lop bao ve trang dang
        # chay. Lop 5 (tuoi du lieu) CO Y khong chan o day: xem buoc "Chuong bao"
        # ben duoi. Tu 23 den 25/11/2026 bo kiem tra day du chan ca ba lan chay,
        # nen so VCB fetch duoc (25.600 -> 25.640) khong bao gio vao duoc repo.
        run: python3 tools/check_all.py --pha truoc-commit

      - name: Commit neu co thay doi
        run: |
          git config user.name  "macro-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # LUU Y: phai git add TRUOC roi moi kiem tra diff --cached.
          # Run #1 (02/11) khong commit duoc vi `git diff --quiet` KHONG thay file
          # chua duoc theo doi: tools/last_run.json con untracked nen diff rong,
          # script thoat som va bao cao khong bao gio vao duoc repo.
          # models_report.json cung phai vao: no la ban chup trang thai mo hinh,
          # check_models.py sinh lai moi lan chay. Khong commit thi ban trong repo
          # cu dan va noi sai ve tinh trang hien tai.
          git add data.js tools/last_run.json tools/models_report.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi, bo qua commit."
            exit 0
          fi
          SUM=$(python3 -c "import json;print(json.load(open('tools/last_run.json'))['summary'])")
          git commit -m "auto: cap nhat field CORE ($SUM)"
          git push

      - name: Doi chieu hop dong mo hinh (bao cao, chua chan)
        if: always()
        # Hien exit 1 vi con mo hinh thieu du lieu. Bo `|| true` khi da nuoi du.
        run: python3 tools/check_models.py || true

      - name: Chuong bao du lieu cu (lop 5, 5b, 6)
        if: always()
        # Chay SAU commit nen du lieu moi da vao repo roi. Buoc nay van lam job
        # do khi du lieu qua han — canh bao van keu, chi khong con giam du lieu.
        run: python3 tools/check_all.py --pha sau-commit

      - name: Bao cao
        if: always()
        run: cat tools/last_run.json 2>/dev/null || echo "chua co bao cao"
